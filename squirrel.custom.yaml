patch:
  show_notifications_when: appropriate     # 状态通知，可设为全开（always）全关（never）  

  # 皮肤主题名称输入在下方，分为浅色和深色
  style:
    # 浅色主题
    color_scheme: mac_light
    # 深色主题
    color_scheme_dark: mac_dark
    candidate_list_layout: linear
    # horizontal is Deprecated since 0.36, Squirrel 0.15, removed since 1.0.1
    # candidate_list_layout: stacked  # stacked | linear
    text_orientation: horizontal  # horizontal | vertical
    inline_preedit: true
    # Whether to embed selected candidate as text in input field
    # inline_candidate: true
    # Whether candidate panel stick to screen edge to reduce jumping
    memorize_size: true
    # Whether transparent colors stack on each other
    mutual_exclusive: false
    # Whether to use a translucent background. Only visible when background color is transparent
    translucency: false
    # Enable to show small arrows that indicates if paging up/down is possible
    show_paging: false
    corner_radius: 7
    hilited_corner_radius: 0
    border_height: -2
    border_width: -2
    # Space between candidates in stacked layout
    line_spacing: 5
    # Space between preedit and candidates in non-inline mode
    spacing: 8
    # A number greater than 0 renders shadow around high-lighted candidate
    shadow_size: 0
    # Controls non-hililighted candidate background size, relative to highlighted
    # Nagetive means shrink, positive meas expand
    #surrounding_extra_expansion: 0
    # format using %@ and %c is deprecated since 1.0, Squirrel 1.0
    # %@ is automatically expanded to "[candidate] [comment]"
    # and %c is replaced by "[label]"
    candidate_format: '[label]  [candidate] [comment] '
    # adjust the base line of text
    #base_offset: 0
    font_face: 'PingFangSC'
    font_point: 16
    # label_font_face: 'Avenir'
    label_font_point: 8
    #comment_font_face: 'Avenir'
    #comment_font_point: 16

  # 皮肤主题
  preset_color_schemes:
    wechat_light:
      name: 微信键盘浅色
      horizontal: true                          # true横排，false竖排
      back_color: 0xFFFFFF                      # 候选条背景色
      border_height: 0                          # 窗口上下高度，大于圆角半径才生效
      border_width: 8                           # 窗口左右宽度，大于圆角半径才生效
      candidate_format: "%c %@ "                # 用 1/6 em 空格 U+2005 来控制编号 %c 和候选词 %@ 前后的空间
      comment_text_color: 0x999999              # 拼音等提示文字颜色
      corner_radius: 5                          # 窗口圆角
      hilited_corner_radius: 5                  # 高亮圆角
      font_face: PingFangSC                     # 候选词字体
      font_point: 16                            # 候选字大小
      hilited_candidate_back_color: 0x75B100    # 第一候选项背景色
      hilited_candidate_text_color: 0xFFFFFF    # 第一候选项文字颜色
      label_font_point: 12                      # 候选编号大小
      text_color: 0x424242                      # 拼音行文字颜色
      inline_preedit: true                      # 拼音位于： 候选框 false | 行内 true

    wechat_dark:
      name: 微信键盘深色
      horizontal: true                          # true横排，false竖排
      back_color: 0x2e2925                      # 候选条背景色
      border_height: 0                          # 窗口上下高度，大于圆角半径才生效
      border_width: 8                           # 窗口左右宽度，大于圆角半径才生效
      candidate_format: "%c %@ "                # 用 1/6 em 空格 U+2005 来控制编号 %c 和候选词 %@ 前后的空间
      comment_text_color: 0x999999              # 拼音等提示文字颜色
      corner_radius: 5                          # 窗口圆角
      hilited_corner_radius: 5                  # 高亮圆角
      font_face: PingFangSC                     # 候选词字体
      font_point: 16                            # 候选字大小
      hilited_candidate_back_color: 0x75B100    # 第一候选项背景色
      hilited_candidate_text_color: 0xFFFFFF    # 第一候选项文字颜色
      label_font_point: 12                      # 候选编号大小
      text_color: 0x424242                      # 拼音行文字颜色
      label_color: 0x999999                     # 预选栏编号颜色
      candidate_text_color: 0xe9e9ea            # 预选项文字颜色
      inline_preedit: true                      # 拼音位于： 候选框 false | 行内 true

    mac_light:
      name: macOS Light
      back_color: 0xf1f2f2 # background
      label_color: 0x808080 # label
      candidate_text_color: 0x494949 # candidate
      comment_text_color: 0x494949 # comment
      hilited_candidate_back_color: 0xd85a00
      hilited_candidate_label_color: 0xffffff
      hilited_candidate_text_color: 0xffffff
      hilited_comment_text_color: 0xffffff

    mac_dark:
      name: macOS Dark
      back_color: 0x393939
      label_color: 0x7b7b7b
      candidate_text_color: 0xebebeb
      comment_text_color: 0xebebeb
      hilited_candidate_back_color: 0xd15900
      hilited_candidate_label_color: 0xffffff
      hilited_candidate_text_color: 0xffffff
      hilited_comment_text_color: 0xffffff

  # 特定App默认中/英文输入
  app_options:
    com.apple.Spotlight: # 聚焦搜索
      ascii_mode: true             # true默认英文,false默认中文
    com.runningwithcrayons.Alfred: # alfred
      ascii_mode: true
    com.apple.Terminal: # 终端
      ascii_mode: true
    com.microsoft.VSCode: # Visual Studio Code
      ascii_mode: true
      ascii_punct: true            # 中文状态输出英文标点(半角)
    com.tencent.Lemon: # 腾讯柠檬
      ascii_mode: true
    com.apple.dt.Xcode: # Xcode
      ascii_mode: true
    com.nektony.App-Cleaner-SII: # App Cleaner & Uninstaller
      ascii_mode: true
    com.xunyong.hapigo: # hapigo
      ascii_mode: true
    com.termius-dmg.mac: # termius
      ascii_mode: true
    com.raycast.macos: # Raycast
      ascii_mode: true
    com.jetbrains.intellij: # idea
      ascii_mode: true
